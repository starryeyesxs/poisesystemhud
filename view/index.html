<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poise and Minimalist HUD</title>
    <link rel="stylesheet" href="minimal.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <!-- 2px rails at y=1 and y=h-1 meet the track's 2px top/bottom border; the fill path is separate so no stroke crosses the track opening. -->
            <symbol id="min-cap-left" viewBox="0 0 22 16"><path fill="rgba(10,11,13,.98)" d="M22 1 H10 L2 8 L10 15 H22 Z"/><path fill="none" stroke="#0f1013" stroke-width="2" stroke-linejoin="miter" d="M22 1 H10 L2 8 L10 15 H22"/><path fill="#3c4047" d="M8.5 8 L11 5.5 L13.5 8 L11 10.5 Z"/></symbol>
            <symbol id="min-cap-right" viewBox="0 0 22 16"><path fill="rgba(10,11,13,.98)" d="M0 1 H12 L20 8 L12 15 H0 Z"/><path fill="none" stroke="#0f1013" stroke-width="2" stroke-linejoin="miter" d="M0 1 H12 L20 8 L12 15 H0"/><path fill="#3c4047" d="M8.5 8 L11 5.5 L13.5 8 L11 10.5 Z"/></symbol>
            <symbol id="min-cap-thin-left" viewBox="0 0 14 10"><path fill="rgba(10,11,13,.98)" d="M14 1 H7 L2 5 L7 9 H14 Z"/><path fill="none" stroke="#0f1013" stroke-width="2" d="M14 1 H7 L2 5 L7 9 H14"/><path fill="#3c4047" d="M5 5 L7 3 L9 5 L7 7 Z"/></symbol>
            <symbol id="min-cap-thin-right" viewBox="0 0 14 10"><path fill="rgba(10,11,13,.98)" d="M0 1 H7 L12 5 L7 9 H0 Z"/><path fill="none" stroke="#0f1013" stroke-width="2" d="M0 1 H7 L12 5 L7 9 H0"/><path fill="#3c4047" d="M5 5 L7 3 L9 5 L7 7 Z"/></symbol>
            <symbol id="min-emblem-frame" viewBox="0 0 56 56"><path fill="rgba(8,10,12,.55)" stroke="rgba(12,13,15,.92)" stroke-width="1" d="M28 1.5 L54.5 28 L28 54.5 L1.5 28 Z"/><path fill="none" stroke="rgba(42,45,50,.75)" stroke-width="1" d="M28 6.5 L49.5 28 L28 49.5 L6.5 28 Z"/><path fill="rgba(12,13,15,.92)" stroke="rgba(42,45,50,.75)" stroke-width=".75" d="M28 .5 L30 2.5 L28 4.5 L26 2.5 Z M28 51.5 L30 53.5 L28 55.5 L26 53.5 Z M.5 28 L2.5 26 L4.5 28 L2.5 30 Z M51.5 28 L53.5 26 L55.5 28 L53.5 30 Z"/></symbol>
            <symbol id="weather-sun" viewBox="0 0 32 32"><circle cx="16" cy="16" r="5"/><path d="M16 3v4m0 18v4M3 16h4m18 0h4M7 7l3 3m12 12 3 3M25 7l-3 3M10 22l-3 3"/></symbol>
            <symbol id="weather-moon" viewBox="0 0 32 32"><path d="M21 5a11 11 0 1 0 7 17A10 10 0 0 1 21 5Z M24 7v4m-2-2h4M27 13v2m-1-1h2"/></symbol>
            <symbol id="weather-cloud" viewBox="0 0 32 32"><path d="M8 22a5 5 0 0 1 0-10 8 8 0 0 1 15-1 5.5 5.5 0 0 1 1 11Z"/></symbol>
            <symbol id="weather-rain" viewBox="0 0 32 32"><path d="M8 19a5 5 0 0 1 0-10 8 8 0 0 1 15-1 5.5 5.5 0 0 1 1 11Z m2 4-1 3m7-3-1 3m7-3-1 3"/></symbol>
            <symbol id="weather-snow" viewBox="0 0 32 32"><path d="M8 19a5 5 0 0 1 0-10 8 8 0 0 1 15-1 5.5 5.5 0 0 1 1 11Z M10 23v4m-2-2h4m4-2v4m-2-2h4m4-2v4m-2-2h4"/></symbol>
            <symbol id="weather-storm" viewBox="0 0 32 32"><path d="M8 19a5 5 0 0 1 0-10 8 8 0 0 1 15-1 5.5 5.5 0 0 1 1 11Z m9 1-3 5h4l-2 5 6-7h-4l2-3"/></symbol>
            <symbol id="weather-indoors" viewBox="0 0 32 32"><path d="M5 15 16 6l11 9M8 13v13h16V13M13 26v-8h6v8"/></symbol>
            <symbol id="weather-unknown" viewBox="0 0 32 32"><path d="M12 11a4 4 0 1 1 6 3.5c-2 1-2 2-2 4m0 4v1"/></symbol>
            <!-- 14px poise debuff icons; they take their color from the .pd-icon class. -->
            <symbol id="pd-sapped" viewBox="0 0 14 14"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6"/><rect x="3" y="6" width="8" height="6.5" rx="1" fill="currentColor"/><path fill="none" stroke="#0f1013" stroke-width="1.4" stroke-linecap="round" d="M7 8.3v2.2"/></symbol>
            <symbol id="pd-enfeebled" viewBox="0 0 14 14"><path fill="currentColor" d="M7 1.2C7 1.2 3 6 3 8.6a4 4 0 0 0 8 0C11 6 7 1.2 7 1.2Z"/><path fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-linecap="round" d="M5.2 8.8a1.9 1.9 0 0 0 1.4 1.8"/><circle cx="8.8" cy="7.2" r=".9" fill="#0f1013"/><circle cx="8" cy="9.6" r=".6" fill="#0f1013"/></symbol>
            <symbol id="pd-numbed" viewBox="0 0 14 14"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M7 1v12M1.8 4l10.4 6M1.8 10l10.4-6M5.4 2.3 7 3.9l1.6-1.6M5.4 11.7 7 10.1l1.6 1.6"/></symbol>
            <symbol id="pd-hemorrhaging" viewBox="0 0 14 14"><path fill="currentColor" d="M5.5 1.2C5.5 1.2 2.4 5.3 2.4 8a3.1 3.1 0 0 0 6.2 0C8.6 5.3 5.5 1.2 5.5 1.2Z"/><path fill="currentColor" d="M10.8 6.4C10.8 6.4 9 8.8 9 10.3a1.8 1.8 0 0 0 3.6 0C12.6 8.8 10.8 6.4 10.8 6.4Z"/><path fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1" stroke-linecap="round" d="M3.9 8.2a1.7 1.7 0 0 0 1.1 1.7"/></symbol>
            <symbol id="pd-scorched" viewBox="0 0 14 14"><path fill="currentColor" d="M7 1c.5 2.2 3.8 3.6 3.8 7a3.8 3.8 0 0 1-7.6 0c0-1.4.6-2.4 1.4-3.2.1 1 .6 1.6 1.2 1.9C6 4.8 6.4 2.8 7 1Z"/><path fill="rgba(255,235,190,.85)" d="M7 8.2c1 .9 1.6 1.7 1.6 2.6a1.6 1.6 0 0 1-3.2 0c0-.9.6-1.7 1.6-2.6Z"/></symbol>
        </defs>
    </svg>
    <section id="world-widget" hidden aria-label="In-game location, time, date, and weather">
        <div class="world-emblem" aria-hidden="true"><svg viewBox="0 0 32 32"><use id="world-icon" href="#weather-unknown"></use></svg></div>
        <div class="world-details">
            <div id="world-location" class="world-location">Awaiting location</div>
            <div class="world-datetime"><span id="world-time">--:--</span><span class="world-separator" aria-hidden="true"> &middot; </span><span id="world-date">Awaiting date</span></div>
            <div id="world-weather" class="world-weather">Awaiting weather</div>
        </div>
    </section>
    <div id="minimal-layout" hidden>
        <div id="min-emblem" hidden>
            <svg class="emblem-frame" viewBox="0 0 56 56" aria-hidden="true"><use href="#min-emblem-frame"></use></svg>
            <div id="light-gem" role="img" aria-label="Light level unavailable" hidden>
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <defs><clipPath id="light-gem-clip"><path d="M24 7 38 24 24 41 10 24Z"/></clipPath></defs>
                    <path class="gem-frame" d="M24 3 42 24 24 45 6 24Z"/>
                    <path class="gem-core" d="M24 7 38 24 24 41 10 24Z"/>
                    <rect id="light-gem-fill" class="gem-fill" x="10" y="41" width="28" height="0" clip-path="url(#light-gem-clip)"/>
                    <path class="gem-edge" d="M24 7 38 24 24 41 10 24Z"/>
                </svg>
            </div>
        </div>
        <div id="minimal-bars">
            <div class="min-row hidden" id="min-health" data-stat="health"></div>
            <div class="min-row hidden" id="min-magicka" data-stat="magicka"></div>
            <div class="min-row hidden" id="min-stamina" data-stat="stamina"></div>
            <div class="min-row min-thin hidden" id="min-poise" data-stat="poise"></div>
            <div id="poise-debuff-icons" hidden aria-label="Active poise debuffs">
                <svg id="pd-icon-sapped" class="pd-icon pd-sapped pd-off" viewBox="0 0 14 14" width="14" height="14" role="img" aria-label="Sapped: poise recovery stopped"><use href="#pd-sapped"></use></svg>
                <svg id="pd-icon-enfeebled" class="pd-icon pd-enfeebled pd-off" viewBox="0 0 14 14" width="14" height="14" role="img" aria-label="Enfeebled: poise recovery capped"><use href="#pd-enfeebled"></use></svg>
                <svg id="pd-icon-numbed" class="pd-icon pd-numbed pd-off" viewBox="0 0 14 14" width="14" height="14" role="img" aria-label="Numbed: poise recovery delayed"><use href="#pd-numbed"></use></svg>
                <svg id="pd-icon-hemorrhaging" class="pd-icon pd-hemorrhaging pd-off" viewBox="0 0 14 14" width="14" height="14" role="img" aria-label="Hemorrhaging: poise recovery slowed"><use href="#pd-hemorrhaging"></use></svg>
                <svg id="pd-icon-scorched" class="pd-icon pd-scorched pd-off" viewBox="0 0 14 14" width="14" height="14" role="img" aria-label="Scorched: melee poise damage increased"><use href="#pd-scorched"></use></svg>
            </div>
        </div>
    </div>
    <div id="target-poise" aria-hidden="true">
        <div class="target-poise-label"><span id="target-poise-name"></span><span id="target-poise-values"></span></div>
        <div class="target-poise-track"><div id="target-poise-fill"></div></div>
    </div>
    <aside id="poise-telemetry" hidden aria-hidden="true" aria-label="Live poise telemetry (developer overlay)">
        <div class="pt-header"><span class="pt-title">POISE TELEMETRY [F10 RELOAD]</span><span id="pt-weapon" class="pt-weapon"></span></div>
        <div id="pt-status" class="pt-status" hidden>Poise unavailable</div>
        <div id="pt-player" class="pt-card">
            <div id="pt-player-name" class="pt-card-title"></div>
            <div id="pt-player-poise" class="pt-line"></div>
            <div id="pt-player-regen" class="pt-line"></div>
            <div class="pt-line"><span id="pt-player-delay" class="pt-badge"></span><span id="pt-player-immune" class="pt-badge"></span></div>
            <div id="pt-player-debuffs" class="pt-pills"></div>
        </div>
        <div id="pt-target" class="pt-card" hidden>
            <div id="pt-target-name" class="pt-card-title"></div>
            <div id="pt-target-poise" class="pt-line"></div>
            <div id="pt-target-regen" class="pt-line"></div>
            <div class="pt-line"><span id="pt-target-delay" class="pt-badge"></span><span id="pt-target-immune" class="pt-badge"></span></div>
            <div id="pt-target-debuffs" class="pt-pills"></div>
        </div>
        <div id="pt-hits" class="pt-hits">
            <div id="pt-hit-0" class="pt-hit" hidden></div>
            <div id="pt-hit-1" class="pt-hit" hidden></div>
            <div id="pt-hit-2" class="pt-hit" hidden></div>
            <div id="pt-hit-3" class="pt-hit" hidden></div>
            <div id="pt-hit-4" class="pt-hit" hidden></div>
        </div>
    </aside>
    <script src="minimal.js"></script>
</body>
</html>
