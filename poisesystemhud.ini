[HUD]
; Weather and location widget.
bEnableWeatherWidget=true
; Light gem is available in the minimalist layout while sneaking.
bEnableSneakLightGem=true
; Distance in pixels from the left screen edge to the minimalist cluster. Range: -500 to 2000.
iSideOffsetLeft=20
; Distance in pixels from the bottom of the screen to the minimalist cluster. Range: -200 to 2000.
iBottomOffset=16
; Show the built-in player poise bar or an optional provider's bar.
bShowPoiseBar=true
; Show exact player poise values on the poise bar for testing.
bShowPoiseNumbers=false
; Show a top-center bar with the name, tier and live poise of the last enemy you hit. It fades after 4 seconds without a hit.
bShowTargetPoiseBar=false
; Dev overlay (upper-left) with live poise numbers, regen timers, the equipped weapon benchmark, the last-hit target and the last 5 hit calculations. Also toggled in game by the console command showpoisedev (not saved). Changes apply with F10.
bShowPoiseTelemetry=false
; Show compact status icons beside the player poise bar for active poise debuffs, plus a tick on the bar where recovery stops while Enfeebled. Needs bEnablePoiseDebuffs. Changes apply with F10.
bShowPoiseDebuffIcons=true
; Tint the Health, Magicka and Stamina bars while a hostile effect is on you: poison, burning, bleeding or drain on Health, a brief shock crackle on Health and Magicka, and frost on Stamina. Changes apply with F10.
bShowReactiveBarEffects=true
; Fade the HUD out when out of combat with full vitals and no weapon or spell drawn.
bDynamicHUD=true
; Keep the HUD permanently visible at full opacity (overrides bDynamicHUD).
bAlwaysOn=false
; HUD opacity while idle. Range: 0.0 to 1.0.
fIdleOpacity=0.0
; Seconds to wait after the HUD becomes idle before fading out. Range: 0.0 to 600.0.
fFadeDelaySeconds=3.0
; F10 reloads the HUD.

[MinimalistGraphics]
; Settings for the minimalist bar layout. Changes apply in real-time.
; Toggle pointed diamond end caps and metallic trim on the minimalist bars.
bMinBarFiligree=true
; Specular highlight and leading-edge sheen intensity on bar fills. Range: 0.0 to 2.0.
fMinBarShine=1.0
; Drop shadow and recessed inner track shadow depth. Range: 0.0 to 2.0.
fMinBarShadow=1.0
; Show faint 25%, 50%, and 75% notch ticks across the bar tracks.
bMinBarNotches=false

[Poise]
; Disable when using another player poise overhaul. Changes apply with F10.
bEnableBuiltInPoise=true
bEnableNPCPoise=true
; Drop vanilla staggers (hits, bashes, ward breaks) on poise-managed actors so only poise breaks stagger. Shouts such as Unrelenting Force and Disarm always keep their stagger. Changes apply with F10.
bSuppressVanillaStaggers=true
; Let the vanilla stagger from a timed bash (a bash timed against an incoming attack) through, for Valhalla Combat or vanilla's interrupt. When false it stays suppressed unless poise breaks. Changes apply with F10.
bAllowTimedBashStaggers=false
; Track poise on non-NPC creatures (and race-matched Draugr, Falmer and Dragon Priests) in four archetype tiers and apply vanilla stagger suppression to them. Changes apply with F10.
bEnableCreaturePoise=true
; Tier multipliers scale fBasePoise only. Armor weight and spell bonuses still add on top. Unlisted creatures use 1.0x.
; Light: wolves, skeevers, mudcrabs, foxes, horkers.
fLightCreaturePoiseMultiplier=0.75
; Medium: draugr, ice wolves, skeletons, falmer, chaurus, sabre cats, frostbite spiders, ice wraiths, spriggans.
fMediumCreaturePoiseMultiplier=1.7
; Heavy: bears, trolls, hagravens, gargoyles, dwarven spheres, chaurus hunters, werewolves.
fHeavyCreaturePoiseMultiplier=3.75
; Boss: dragons, giants, mammoths, dwarven centurions, lurkers, dragon priests. Breaking a boss always staggers at full strength.
fBossCreaturePoiseMultiplier=6.0
; Boss-tier creatures regenerate poise at this multiple of fRegenRatePerSecond.
fBossCreatureRegenMultiplier=1.5
; Poise damage dealt by creature attacks scales by the attacker's tier on top of fCreatureMultiplier.
fLightCreatureDamageMultiplier=0.6
fMediumCreatureDamageMultiplier=1.2
fHeavyCreatureDamageMultiplier=1.375
fBossCreatureDamageMultiplier=2.25
; Seconds a creature cannot be poise-broken again after it staggers, so light-attack spam cannot stunlock it.
fCreatureStaggerImmunitySeconds=2.0
; Summoned and other commanded actors have their maximum poise multiplied by this.
fSummonPoiseMultiplier=1.5
; Poise damage from spells cast by anyone other than the player is scaled by this.
fNPCMagicPoiseMultiplier=0.6
fBasePoise=40.0
fArmorWeightMultiplier=1.0
; Player shield weight multiplier, also used for NPCs when the toggle below is false. Range: -1.0 to 2.0; maximum poise has a floor of 10.
fShieldWeightPoiseMultiplier=0.0
; When true, non-player actors use fArmorWeightMultiplier for shield weight instead.
bApplyShieldWeightToNPCs=true
fBaseHitPoiseDamage=8.0
fWeaponWeightDamageMultiplier=0.5
fTwoHandedMultiplier=0.85
; Bash poise multipliers: bashing with a shield equipped, and a weapon pommel bash without one.
fShieldBashMultiplier=1.0
fWeaponBashMultiplier=0.35
fCreatureMultiplier=0.8
fProjectileMultiplier=0.8
fPowerAttackMultiplier=1.5
; Share of poise damage taken per physical hit while blocking: shield (lower is safer) and weapon-only.
fShieldBlockedPhysicalMultiplier=0.25
fWeaponBlockedPhysicalMultiplier=0.45
fUnblockedPhysicalMultiplier=2.5
fRegenDelaySeconds=3.0
fRegenRatePerSecond=8.0
fStaggerImmunitySeconds=1.0
; Share of an incoming hit's physical damage (sneak and perk multipliers included) added to poise damage before the other multipliers, capped by fPhysicalDamagePoiseCap.
fPhysicalDamagePoiseMultiplier=0.05
fPhysicalDamagePoiseCap=6.0
; Maximum poise bonus from the summed base armor rating of worn Light Armor (shields excluded), capped by fLightArmorRatingPoiseCap.
fLightArmorRatingPoiseMultiplier=0.15
fLightArmorRatingPoiseCap=15.0
; Flesh spell and Dragonhide poise is scaled by the worn armor class: Heavy takes priority, then Light, otherwise 1.0 (shields ignored). 0.0 disables flesh poise for that class.
fLightArmorFleshMultiplier=0.75
fHeavyArmorFleshMultiplier=0.45
fFleshSpellPoiseMultiplier=0.45
fDragonhidePoiseBonus=60.0
fMagicBurstPoiseMultiplier=2.0
fMagicStaggerPoiseMultiplier=10.0
fConcentrationPoiseMultiplier=1.0
fConcentrationIntervalSeconds=1.0
fConcentrationMaxPoisePerInterval=15.0
fWardMagicDamageMultiplier=0.35
; Magic poise multipliers while actively blocking with a shield or with a weapon. They do not stack with ward mitigation.
fShieldBlockedMagicMultiplier=0.4
fWeaponBlockedMagicMultiplier=0.7

[Poise Debuffs]
; Hostile damage-over-time and drain effects slow posture recovery instead of dealing direct poise damage. Each debuff changes one value, and same-type effects never stack. Master switch: false skips all effect scanning and hides the icons. Changes apply with F10.
bEnablePoiseDebuffs=true
; Sapped: a hostile absorb/drain effect (such as Vampiric Drain) stops poise recovery entirely while it lasts.
bEnableSappedDebuff=true
; Enfeebled: a hostile poison caps recovery at a ceiling (share of maximum poise) without lowering poise already above it. The strongest poison wins: 0 magnitude per second gives the Max ceiling and fEnfeebledMagnitudeForMin gives the Min ceiling.
bEnableEnfeebledDebuff=true
fEnfeebledRegenCeilingMin=0.70
fEnfeebledRegenCeilingMax=0.85
fEnfeebledMagnitudeForMin=10.0
; No debuff can push the recovery ceiling below this share of maximum poise.
fMinGlobalRegenCeiling=0.60
; Numbed: a lingering hostile frost damage effect adds this many seconds to the regeneration delay after a hit.
bEnableNumbedDebuff=true
fNumbedRegenDelayBonus=1.0
; Hemorrhaging: a hostile bleed effect multiplies the poise regeneration rate. An effect counts as a bleed when its editor ID, name or spell name contains any of the comma-separated keywords (case-insensitive). Vanilla Skyrim has no bleed effects, so this mainly serves bleed mods.
bEnableHemorrhagingDebuff=true
fHemorrhagingRegenRateMultiplier=0.65
sHemorrhagingEffectKeywords=bleed,hemorrhag
; Scorched: a lingering hostile fire damage effect multiplies poise damage from incoming non-projectile physical hits (melee, bashes and creature attacks).
bEnableScorchedDebuff=true
fScorchedMeleeDamageMultiplier=1.20

[Magic Poise]
; Channeled concentration spells (Flames, Frostbite, Sparks and similar) deal no direct poise damage by default, leaving poise damage to impact spells (projectiles, beams and explosions). Their debuffs still apply, such as Scorched from Flames and Numbed from Frostbite. Changes apply with F10.
bConcentrationSpellsDealPoise=false
